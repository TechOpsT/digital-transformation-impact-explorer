name: Phase 2 validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Helm availability
        run: helm version --short
      - name: Lint chart
        run: helm lint charts/transformation-explorer --strict
      - name: Validate rendered controls
        run: node tests/kubernetes/validate-chart.mjs
