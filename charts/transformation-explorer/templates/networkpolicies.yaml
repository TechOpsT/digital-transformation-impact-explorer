{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: {{ include "transformation-explorer.namespace" . }} }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-traffic, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: web } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} } }
        - podSelector: { matchLabels: { app.kubernetes.io/component: test } }
      ports: [{ protocol: TCP, port: 4173 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: content } } }]
      ports: [{ protocol: TCP, port: 8001 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: assessment } } }]
      ports: [{ protocol: TCP, port: 8002 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: test-traffic, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: test } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: web } } }]
      ports: [{ protocol: TCP, port: 4173 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: bootstrap-traffic, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: bootstrap } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: content-traffic, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: content } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: web } }
        - podSelector: { matchLabels: { app.kubernetes.io/component: assessment } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} } }
      ports: [{ protocol: TCP, port: 8001 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: assessment-traffic, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: assessment } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: web } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} } }
      ports: [{ protocol: TCP, port: 8002 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: content } } }]
      ports: [{ protocol: TCP, port: 8001 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: recommendation } } }]
      ports: [{ protocol: TCP, port: 8003 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/component: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: recommendation-traffic, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: recommendation } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: assessment } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} } }
      ports: [{ protocol: TCP, port: 8003 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-traffic, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions: [{ key: app.kubernetes.io/component, operator: In, values: [content, assessment, bootstrap] }]
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: redis-traffic, namespace: {{ include "transformation-explorer.namespace" . }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: redis } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/component: assessment } } }]
      ports: [{ protocol: TCP, port: 6379 }]
{{- end }}
