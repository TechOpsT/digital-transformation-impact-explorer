apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-smoke-test"
  namespace: {{ include "transformation-explorer.namespace" . }}
  labels:
    {{- include "transformation-explorer.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: transformation-explorer-web
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: smoke-test
      image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
      imagePullPolicy: {{ .Values.images.web.pullPolicy }}
      command: ["node", "-e", "fetch('http://web').then(r => { if (!r.ok) throw new Error(String(r.status)); return r.text() }).then(b => { if (!b.includes('Transformation Impact Explorer')) throw new Error('unexpected body') })"]
      securityContext:
        {{- include "transformation-explorer.securityContext" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      resources:
        {{- toYaml .Values.resources.web | nindent 8 }}
      volumeMounts: [{ name: tmp, mountPath: /tmp }]
  volumes: [{ name: tmp, emptyDir: {} }]
