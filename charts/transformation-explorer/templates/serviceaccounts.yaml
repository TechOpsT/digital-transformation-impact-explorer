{{- range $component := list "web" "content" "assessment" "recommendation" "postgres" "redis" "bootstrap" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transformation-explorer-{{ $component }}
  namespace: {{ include "transformation-explorer.namespace" $ }}
  labels:
    {{- include "transformation-explorer.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
---
{{- end }}
