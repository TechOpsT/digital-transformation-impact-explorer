apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "transformation-explorer.namespace" . }}
  labels: &postgresLabels
    {{- include "transformation-explorer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "transformation-explorer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata: { labels: *postgresLabels }
    spec:
      serviceAccountName: transformation-explorer-postgres
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.database.name | quote }} }
            - { name: POSTGRES_USER, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: POSTGRES_SUPERUSER_PASSWORD } }
            - name: CONTENT_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: CONTENT_DATABASE_PASSWORD } }
            - name: ASSESSMENT_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: ASSESSMENT_DATABASE_PASSWORD } }
            - name: MIGRATION_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: MIGRATION_DATABASE_PASSWORD } }
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          startupProbe: { exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", {{ .Values.database.name | quote }}] }, periodSeconds: 3, failureThreshold: 30 }
          readinessProbe: { exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", {{ .Values.database.name | quote }}] }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", {{ .Values.database.name | quote }}] }, periodSeconds: 10, timeoutSeconds: 3 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: runtime, mountPath: /var/run/postgresql }
      volumes:
        - name: init
          configMap: { name: transformation-explorer-postgres-init, defaultMode: 0555 }
        - name: runtime
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.database.storageClass | quote }}
        resources: { requests: { storage: {{ .Values.database.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "transformation-explorer.namespace" . }}
  labels:
    {{- include "transformation-explorer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "transformation-explorer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ include "transformation-explorer.namespace" . }}
  labels: &redisLabels
    {{- include "transformation-explorer.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "transformation-explorer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata: { labels: *redisLabels }
    spec:
      serviceAccountName: transformation-explorer-redis
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          imagePullPolicy: {{ .Values.images.redis.pullPolicy }}
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          securityContext:
            {{- include "transformation-explorer.securityContext" . | nindent 12 }}
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}
          startupProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 3, failureThreshold: 20 }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 10 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: data, mountPath: /data }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ include "transformation-explorer.namespace" . }}
  labels:
    {{- include "transformation-explorer.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "transformation-explorer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports: [{ name: redis, port: 6379, targetPort: redis }]
